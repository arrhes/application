worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  server {
    listen 80;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE6";
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript font/woff2;
    gzip_comp_level   9;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the `api` service through Docker's embedded DNS (127.0.0.11).
    # The resolver is only used when /api is requested.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the api service on the compose network.
    # Used when the SPA is built with VITE_API_BASE_URL=/api (self-hosted).
    # When the SPA is built against a public API URL this location is unused.
    location /api/ {
      set $api_host api;
      proxy_pass http://$api_host:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Immutable hashed assets (JS, CSS, fonts, images) - cache for 1 year
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|webmanifest)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA fallback - all routes served by index.html
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html =404;
    }
  }
}