worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Dashboard SPA (port 5173)
    server {
        listen 5173;

        gzip on;
        gzip_http_version 1.1;
        gzip_disable "MSIE6";
        gzip_min_length 256;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript font/woff2;
        gzip_comp_level 9;

        root /app/dashboard/build;
        index index.html;

        # Immutable hashed assets (JS, CSS, fonts, images) - cache for 1 year
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|webmanifest|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback - all routes served by index.html
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html =404;
        }

        # Proxy API requests to Node.js backend
        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
