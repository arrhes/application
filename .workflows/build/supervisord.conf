[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node ./api/build/server.js
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    PORT="3000",
    ENV="production",
    VERBOSE="false",
    COOKIES_DOMAIN="%(ENV_COOKIES_DOMAIN)s",
    COOKIES_KEY="%(ENV_COOKIES_KEY)s",
    API_BASE_URL="%(ENV_API_BASE_URL)s",
    WEBSITE_BASE_URL="%(ENV_WEBSITE_BASE_URL)s",
    DASHBOARD_BASE_URL="%(ENV_DASHBOARD_BASE_URL)s",
    SQL_DATABASE_URL="%(ENV_SQL_DATABASE_URL)s",
    STORAGE_ENDPOINT="%(ENV_STORAGE_ENDPOINT)s",
    STORAGE_BUCKET_NAME="%(ENV_STORAGE_BUCKET_NAME)s",
    STORAGE_ACCESS_KEY="%(ENV_STORAGE_ACCESS_KEY)s",
    STORAGE_SECRET_KEY="%(ENV_STORAGE_SECRET_KEY)s",
    STORAGE_REGION="%(ENV_STORAGE_REGION)s"
