# ==============================================================================
# Build Compose
# ==============================================================================
# Single source of truth for building all images.
# Used by both local builds (`just build`) and CI (GitHub Actions).
#
# Services:
#   ci        - Lint + unit tests + build (gate before packaging)
#   api       - Production API image
#   website   - Production Website image (nginx + static)
#   dashboard - Production Dashboard image (nginx + SPA)
#   worker    - Production Worker image (background job processor)
#
# Usage:
#   docker compose -f .workflows/build/compose.yml build ci
#   docker compose -f .workflows/build/compose.yml build api website worker
# ==============================================================================

services:
  ci:
    build:
      context: ../..
      dockerfile: .workflows/build/packages/ci/Dockerfile

  api:
    image: arrhes-api:${ARRHES_VERSION:-dev}
    build:
      context: ../..
      dockerfile: .workflows/build/packages/api/Dockerfile

  website:
    image: arrhes-website:${ARRHES_VERSION:-dev}
    build:
      context: ../..
      dockerfile: .workflows/build/packages/website/Dockerfile
      args:
        - VITE_WEBSITE_BASE_URL=${VITE_WEBSITE_BASE_URL:-}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_DASHBOARD_BASE_URL=${VITE_DASHBOARD_BASE_URL:-}

  dashboard:
    image: arrhes-dashboard:${ARRHES_VERSION:-dev}
    build:
      context: ../..
      dockerfile: .workflows/build/packages/dashboard/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_WEBSITE_BASE_URL=${VITE_WEBSITE_BASE_URL:-}


  worker:
    image: arrhes-worker:${ARRHES_VERSION:-dev}
    build:
      context: ../..
      dockerfile: .workflows/build/packages/worker/Dockerfile
