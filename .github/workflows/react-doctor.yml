name: React Doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Run React Doctor
        run: .scripts/react-doctor.sh
